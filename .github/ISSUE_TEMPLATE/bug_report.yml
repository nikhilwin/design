name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please search existing issues first. For security problems do **not** use
        this form; report it privately through the repository's Security tab.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the editor
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor (canvas, tools, panels)
        - Dashboard and designs
        - Templates, elements, fonts
        - Accounts and sign-in
        - Sharing and comments
        - Export (PNG, JPG, SVG, PDF)
        - Self-hosting / Docker
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, commit hash, or "hosted instance".
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 130 on Fedora 40
  - type: textarea
    id: logs
    attributes:
      label: Logs, console output or screenshots
      description: Browser console errors, `docker compose logs api` output, screenshots. Remove personal data first.
      render: shell
